name: Publicar APK V1 no GitHub Releases
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-apk-v1.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compilar APK Android V1
        run: gradle --no-daemon :app:assembleDebug
      - name: Publicar link estável do APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=v1.0.2
          FILENAME=ZapAPI_Messenger_V1_1.0.2.apk
          cp app/build/outputs/apk/debug/app-debug.apk "$FILENAME"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" "$FILENAME" --clobber
          else
            gh release create "$VERSION" "$FILENAME" --target "${GITHUB_SHA}" --title "ZapAPI Messenger V1 1.0.2 (teste)" --notes "APK Android de teste da V1. Corrige a URL de autenticacao que alternava indevidamente o servidor da V1. Instalacao manual; build debug, nao e uma release de producao." --prerelease
          fi
